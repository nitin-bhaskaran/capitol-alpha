# Capitol Alpha configuration.
# Copy this file to config.yaml and fill in your API keys.
# NEVER commit config.yaml to git.

telegram:
  bot_token: ""
  chat_id: ""
  admin_user_ids: []

trading212:
  api_key: ""
  api_secret: ""
  environment: "demo"
  max_order_gbp: 500.0
  max_daily_orders: 5
  default_order_type: "market"
  limit_offset_pct: 0.5

execution:
  mode: "t212_demo"          # disabled | local_paper | t212_demo | t212_live
  live_enabled: false        # Must remain false until validation gates pass.
  max_order_gbp_demo: 100.0
  max_order_gbp_live: 50.0
  default_demo_quantity: 0.1 # Used by local_paper; T212 quantity is sized from a price estimate.
  default_order_type: "market"
  validation_days_required: 10
  allow_fractional_shares: true

risk:
  max_positions: 8
  max_single_name_exposure_pct: 10.0
  max_sector_exposure_pct: 30.0
  max_daily_loss_pct: 3.0
  fractional_kelly: 0.25
  starting_equity_gbp: 10000.0

model:
  active_model_path: "models/event_alpha_model.json"
  min_trade_confidence: 0.58
  min_expected_excess_return: 0.015
  min_alert_confidence: 0.48
  default_model_version: "event-alpha-ensemble-v0"

scoring:
  vip_weight: 0.30
  committee_weight: 0.20
  filing_gap_weight: 0.20
  trade_size_weight: 0.15
  historical_alpha_weight: 0.15
  min_score_to_alert: 0.40
  min_score_to_suggest_trade: 0.60

data_sources:
  poll_interval_minutes: 30
  capitol_trades_enabled: true
  quiver_api_token: ""
  finnhub_api_token: ""

vip_watchlist:
  tier1_politicians:
    - "Donald J. Trump"
    - "Donald Trump Jr."
    - "Eric Trump"
    - "Ivanka Trump"
    - "Jared Kushner"
    - "Nancy Pelosi"
    - "Dan Crenshaw"
    - "Tommy Tuberville"
    - "Marjorie Taylor Greene"
  tier2_politicians:
    - "Michael McCaul"
    - "Josh Gottheimer"
    - "Mark Green"
    - "Ro Khanna"
    - "Kevin Hern"
    - "Scott Franklin"
    - "John Curtis"
  high_signal_committees:
    - "Armed Services"
    - "Financial Services"
    - "Energy and Commerce"
    - "Intelligence"
    - "Ways and Means"
    - "Appropriations"
    - "Foreign Affairs"
    - "Judiciary"
